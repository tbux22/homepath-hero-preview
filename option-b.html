<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HomePath hero – Option B (One question) – design preview</title>
<style>
:root{
  --bg:#23323d; --bg-2:#2b3d4a; --text:#f4f6f7; --muted:#b9c6ce; --line:#415463;
  --accent:#d9b57a; --paper:#f4f6f7; --ink:#1f2d36;
  --serif:Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);color:var(--text);background:var(--bg);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
header{display:flex;justify-content:space-between;align-items:center;padding:26px 36px}
.wordmark{font-family:var(--serif);font-size:23px;text-decoration:none;letter-spacing:.01em}
.talk{font-size:16px;color:var(--muted);text-underline-offset:5px;text-decoration-thickness:1px;min-height:44px;display:inline-flex;align-items:center}
.talk:hover{color:var(--text);text-decoration-thickness:2px}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 24px 56px}
.panel{width:100%;max-width:640px;text-align:center}
.rule{width:44px;height:2px;background:var(--accent);margin:0 auto 34px;border:0}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(32px,5vw,52px);line-height:1.15;letter-spacing:-.01em;margin:0;text-wrap:balance}
.sub{margin:18px auto 0;color:var(--muted);font-size:clamp(16px,1.5vw,19px);line-height:1.5}
.stack{display:flex;flex-direction:column;gap:12px;margin:40px auto 0;max-width:420px}
.btn{appearance:none;font:inherit;font-size:19px;cursor:pointer;min-height:60px;border-radius:999px;padding:0 28px;display:flex;align-items:center;justify-content:center;gap:12px;text-decoration:none;transition:background .2s,border-color .2s,transform .15s}
.btn.primary{background:var(--paper);color:var(--ink);border:2px solid var(--paper)}
.btn.primary:hover{background:#fff;transform:translateY(-1px)}
.btn.secondary{background:transparent;color:var(--text);border:2px solid var(--line)}
.btn.secondary:hover{border-color:var(--text)}
.btn:active{transform:none}
.btn .arrow{color:var(--accent);font-size:21px}
.btn.primary .arrow{color:#8a6420}
.escape{margin:26px 0 0;font-size:16px}
.escape a{color:var(--muted);text-underline-offset:5px;min-height:44px;display:inline-flex;align-items:center}
.escape a:hover{color:var(--text)}
.screen[hidden]{display:none}
.screen{animation:fade .35s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.result p.lead{font-family:var(--serif);font-size:clamp(24px,3.4vw,34px);line-height:1.25;margin:0 auto;max-width:18em}
.result .stack{margin-top:34px}
.link{background:none;border:0;color:var(--muted);font:inherit;font-size:16px;text-decoration:underline;text-underline-offset:5px;cursor:pointer;margin-top:20px;min-height:44px}
.link:hover{color:var(--text)}
.proto{font-size:13px;color:var(--muted);margin-top:18px}
footer{text-align:center;padding:0 24px 26px;font-size:14px;color:var(--muted)}
@media (max-width:640px){
  header{padding:16px 20px}.talk{display:none}
  main{align-items:flex-start;padding-top:8vh}
  .stack{max-width:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="wordmark" href="#" aria-label="HomePath home">HomePath</a>
  <a class="talk" href="#directory">Talk with an attorney</a>
</header>

<main>
  <div class="panel">
    <section class="screen" id="ask" aria-labelledby="q">
      <hr class="rule">
      <h1 id="q">Have you received court papers about your mortgage?</h1>
      <p class="sub">A plain-English guide for Connecticut homeowners.</p>
      <div class="stack">
        <button class="btn primary" type="button" data-key="yes">Yes, I have papers <span class="arrow" aria-hidden="true">→</span></button>
        <button class="btn secondary" type="button" data-key="no">No papers yet</button>
      </div>
      <p class="escape"><a href="#directory">Talk with an attorney</a></p>
    </section>

    <section class="screen result" id="result" hidden aria-live="polite">
      <hr class="rule">
      <p class="lead" id="lead" tabindex="-1"></p>
      <div class="stack">
        <a class="btn primary" id="go" href="#">Continue <span class="arrow" aria-hidden="true">→</span></a>
      </div>
      <button class="link" id="back" type="button">Change my answer</button>
      <p class="proto">Design preview. The next screen is not built yet.</p>
    </section>
  </div>
</main>

<footer>A directory, not a law firm.</footer>

<script>
(function(){
  var copy={
    yes:"Next: a short guide to reading court papers and what usually comes next.",
    no:"Next: a short guide to where you are in the process and your options."
  };
  var ask=document.getElementById('ask'),res=document.getElementById('result'),lead=document.getElementById('lead');
  function pick(k){ask.hidden=true;res.hidden=false;lead.textContent=copy[k];lead.focus();}
  [].forEach.call(document.querySelectorAll('[data-key]'),function(b){b.addEventListener('click',function(){pick(b.dataset.key)})});
  document.getElementById('back').addEventListener('click',function(){res.hidden=true;ask.hidden=false;document.querySelector('[data-key=yes]').focus();});
  var h=location.hash.replace('#','');if(copy[h])pick(h);
})();
</script>
</body>
</html>
