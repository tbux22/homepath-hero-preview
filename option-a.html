<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HomePath hero – Option A (Two doors) – design preview</title>
<style>
:root{
  --ink:#1f2d36; --ink-soft:#4a5b66; --slate:#2f4858; --slate-dark:#243a47;
  --ground:#f6f8f9; --line:#d5dde2; --card:#ffffff; --accent:#b88a3a;
  --serif:Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--ground);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
header{display:flex;justify-content:space-between;align-items:center;max-width:1120px;width:100%;margin:0 auto;padding:28px 32px}
.wordmark{font-family:var(--serif);font-size:24px;letter-spacing:.01em;text-decoration:none;color:var(--slate-dark)}
.talk{font-size:16px;color:var(--ink-soft);text-underline-offset:5px;text-decoration-thickness:1px;min-height:44px;display:inline-flex;align-items:center}
.talk:hover{color:var(--slate-dark);text-decoration-thickness:2px}
main{flex:1;max-width:1120px;width:100%;margin:0 auto;padding:clamp(24px,7vh,88px) 32px 40px;position:relative}
.horizon{position:absolute;left:0;right:0;bottom:0;height:140px;pointer-events:none;z-index:0}
.stage{position:relative;z-index:1}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(36px,6vw,68px);line-height:1.08;letter-spacing:-.015em;margin:0;max-width:15em;color:var(--slate-dark);text-wrap:balance}
.sub{font-size:clamp(17px,1.6vw,20px);line-height:1.5;color:var(--ink-soft);margin:22px 0 0;max-width:34em}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:44px;max-width:720px}
.choice{appearance:none;font:inherit;text-align:left;cursor:pointer;background:var(--card);color:var(--slate-dark);border:1.5px solid var(--line);border-radius:14px;padding:22px 24px;min-height:84px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:clamp(19px,2vw,22px);font-family:var(--serif);box-shadow:0 1px 2px rgba(31,45,54,.06);transition:border-color .2s,box-shadow .2s,transform .2s,background .2s,color .2s}
.choice .arrow{font-family:var(--sans);font-size:22px;transition:transform .2s;color:var(--accent)}
.choice:hover{border-color:var(--slate);box-shadow:0 6px 18px rgba(31,45,54,.10);transform:translateY(-2px)}
.choice:hover .arrow{transform:translateX(4px)}
.choice:active{transform:translateY(0)}
.choice[aria-pressed="true"]{background:var(--slate);border-color:var(--slate);color:#fff}
.choice[aria-pressed="true"] .arrow{color:#fff}
.choices[data-picked] .choice[aria-pressed="false"]{opacity:.6}
.escape{margin:22px 0 0;font-size:16px}
.escape a{color:var(--ink-soft);text-underline-offset:5px;min-height:44px;display:inline-flex;align-items:center}
.escape a:hover{color:var(--slate-dark)}
.next{margin-top:28px;max-width:720px;border-left:3px solid var(--accent);padding:4px 0 4px 20px;min-height:0}
.next[hidden]{display:none}
.next p{margin:0 0 10px;font-size:18px;line-height:1.5;color:var(--ink)}
.next .go{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;background:var(--slate-dark);color:#fff;text-decoration:none;font-size:17px}
.next .go:hover{background:var(--ink)}
.next .proto{font-size:13px;color:var(--ink-soft);margin-top:10px}
.next .back{margin-left:16px;font-size:16px;color:var(--ink-soft);background:none;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:5px;min-height:44px;font-family:inherit}
footer{max-width:1120px;width:100%;margin:0 auto;padding:20px 32px 28px;font-size:14px;color:var(--ink-soft);position:relative;z-index:1}
.rise{animation:rise .5s ease both}
.rise.d1{animation-delay:.08s}.rise.d2{animation-delay:.16s}.rise.d3{animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:640px){
  header{padding:18px 20px}main{padding:24px 20px 32px}footer{padding:16px 20px 24px}
  .talk{display:none}
  .choices{grid-template-columns:1fr;gap:12px;margin-top:32px}
  .choice{min-height:72px;padding:18px 20px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header>
  <a class="wordmark" href="#" aria-label="HomePath home">HomePath</a>
  <a class="talk" href="#directory">Talk with an attorney</a>
</header>

<main>
  <svg class="horizon" viewBox="0 0 1200 140" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 110 C 260 70, 520 120, 760 92 S 1100 60, 1200 78" fill="none" stroke="#c9d3d9" stroke-width="1.5"/>
  </svg>
  <div class="stage">
    <h1 class="rise">Have you received court papers about your mortgage?</h1>
    <p class="sub rise d1">A plain-English guide for Connecticut homeowners.</p>

    <div class="choices rise d2" id="choices" role="group" aria-label="Court papers">
      <button class="choice" type="button" data-key="yes" aria-pressed="false"><span>Yes, I have papers</span><span class="arrow" aria-hidden="true">→</span></button>
      <button class="choice" type="button" data-key="no" aria-pressed="false"><span>No papers yet</span><span class="arrow" aria-hidden="true">→</span></button>
    </div>

    <p class="escape rise d3"><a href="#directory">Talk with an attorney</a></p>

    <div class="next" id="next" hidden aria-live="polite">
      <p id="nextText"></p>
      <a class="go" id="nextGo" href="#">Continue</a><button class="back" id="back" type="button">Change my answer</button>
      <p class="proto">Design preview. The next screen is not built yet.</p>
    </div>
  </div>
</main>

<footer>A directory, not a law firm.</footer>

<script>
(function(){
  var copy={
    yes:"Next: a short guide to reading court papers and what usually comes next.",
    no:"Next: a short guide to where you are in the process and your options."
  };
  var btns=[].slice.call(document.querySelectorAll('.choice')),
      box=document.getElementById('choices'),
      next=document.getElementById('next'),
      text=document.getElementById('nextText');
  function pick(k){
    btns.forEach(function(b){b.setAttribute('aria-pressed',b.dataset.key===k?'true':'false')});
    box.setAttribute('data-picked',k);
    text.textContent=copy[k];
    next.hidden=false;
    document.getElementById('nextGo').focus({preventScroll:false});
  }
  btns.forEach(function(b){b.addEventListener('click',function(){pick(b.dataset.key)})});
  document.getElementById('back').addEventListener('click',function(){
    btns.forEach(function(b){b.setAttribute('aria-pressed','false')});
    box.removeAttribute('data-picked');next.hidden=true;btns[0].focus();
  });
  var h=location.hash.replace('#','');if(copy[h])pick(h);
})();
</script>
</body>
</html>
